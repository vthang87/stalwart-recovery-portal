services:
  stalwart-recovery:
    image: ghcr.io/vthang87/stalwart-recovery-portal:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - stalwart_recovery_data:/data
    networks:
      - mail-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000${BASE_PATH:-/account}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  stalwart_recovery_data:

networks:
  mail-network:
    external: true
